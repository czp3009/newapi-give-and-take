name: Release implementation

on:
  workflow_call:
    inputs:
      npm:
        default: false
        type: boolean
      github:
        default: false
        type: boolean
      docker:
        default: false
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Read project version
        id: version
        shell: bash
        run: |
          release_version=$(./gradlew --quiet printVersion --console=plain)
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          npm exec --yes --package=semver@7 -- semver "$RELEASE_VERSION" > version.txt
          test "$(cat version.txt)" = "$RELEASE_VERSION"
      - name: Check npm credentials
        if: inputs.npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Configure the NPM_TOKEN repository secret before publishing."
            exit 1
          fi
      - name: Check Docker Hub credentials
        if: inputs.docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets before publishing."
            exit 1
          fi
      - name: Create release tag
        if: inputs.github
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          tag_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")
          if [ -z "$tag_ref" ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$RELEASE_COMMIT" > /dev/null
          elif [ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" != "$RELEASE_COMMIT" ]; then
            echo "::error::Tag $tag does not point to release commit $RELEASE_COMMIT."
            exit 1
          fi

  build:
    name: build(${{ matrix.target }})
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((inputs.npm || inputs.github) && '[
            {"os":"ubuntu-24.04","target":"linuxX64","task":"LinuxX64","konan":"linux_x64","platform":"linux-x64","extension":"kexe"},
            {"os":"macos-15","target":"macosArm64","task":"MacosArm64","konan":"macos_arm64","platform":"macos-arm64","extension":"kexe"},
            {"os":"windows-2025","target":"mingwX64","task":"MingwX64","konan":"mingw_x64","platform":"windows-x64","extension":"exe"}
          ]' || '[
            {"os":"ubuntu-24.04","target":"linuxX64","task":"LinuxX64","konan":"linux_x64","platform":"linux-x64","extension":"kexe"}
          ]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # setup-gradle owns Gradle caches; do not also enable setup-java's Gradle cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Install Linux Curl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Test and build native package
        shell: bash
        run: ./gradlew ${{ matrix.target }}Test generateKotlinNativeNpm${{ matrix.task }}Package --console=plain
      - name: Test JVM and generate main package
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew jvmTest generateKotlinNativeNpmMainPackage --console=plain
      - name: Pack npm packages
        if: inputs.npm
        shell: bash
        run: |
          mkdir -p build/npm-release
          npm pack ./build/kotlinNativeNpmPublishing/platforms/${{ matrix.konan }} --pack-destination ./build/npm-release
          if [ "$RUNNER_OS" = Linux ]; then
            npm pack ./build/kotlinNativeNpmPublishing/main --pack-destination ./build/npm-release
          fi
      - name: Upload npm packages
        if: inputs.npm
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.platform }}
          path: build/npm-release/*.tgz
          if-no-files-found: error
      - name: Prepare GitHub executable
        if: inputs.github
        shell: bash
        run: |
          mkdir -p build/github-release
          cp "build/bin/${{ matrix.target }}/releaseExecutable/newapi-give-and-take.${{ matrix.extension }}" "build/github-release/newapi-give-and-take-${{ matrix.platform }}.${{ matrix.extension }}"
      - name: Upload GitHub release assets
        if: inputs.github
        uses: actions/upload-artifact@v7
        with:
          name: github-${{ matrix.platform }}
          path: build/github-release/newapi-give-and-take-${{ matrix.platform }}.${{ matrix.extension }}
          if-no-files-found: error
      - name: Upload Docker executable
        if: inputs.docker && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: docker-linux-x64
          path: build/bin/linuxX64/releaseExecutable/newapi-give-and-take.kexe
          if-no-files-found: error

  npm:
    if: inputs.npm
    needs: [ validate, build ]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: npm-*
          path: packages
          merge-multiple: true
      - name: Publish platform packages, then main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then tag=next; fi
          for target in linux_x64 macos_arm64 mingw_x64; do
            npm publish "./packages/newapi-give-and-take-${target}-${RELEASE_VERSION}.tgz" --access public --tag "$tag" --registry https://registry.npmjs.org
          done
          npm publish "./packages/newapi-give-and-take-${RELEASE_VERSION}.tgz" --access public --tag "$tag" --registry https://registry.npmjs.org

  github:
    if: inputs.github
    needs: [ validate, build ]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: github-*
          path: assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "v${RELEASE_VERSION}" assets/* --verify-tag --title "v${RELEASE_VERSION}" --generate-notes "${args[@]}"

  docker:
    if: inputs.docker
    needs: [ validate, build ]
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: docker-linux-x64
          path: build/bin/linuxX64/releaseExecutable
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/newapi-give-and-take
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest,enable=${{ !contains(env.RELEASE_VERSION, '-') }}
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-linux-amd64
          cache-to: type=gha,scope=docker-linux-amd64,mode=max
